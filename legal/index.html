<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RiskWise — Legal</title>
<style>
  :root { color-scheme: light dark; --bg:#F8FBF8; --card:#ffffff; --ink:#0f2a29; --muted:#5a726f; --line:#e2ece8; --accent:#0b6b4f; }
  @media (prefers-color-scheme: dark) { :root { --bg:#071716; --card:#0e2523; --ink:#e7f2ee; --muted:#9fb5b0; --line:#1c3a37; --accent:#4fd1a5; } }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif; background:var(--bg); color:var(--ink); line-height:1.6; display:flex; min-height:100vh; align-items:center; justify-content:center; padding:24px; }
  .card { max-width:520px; width:100%; background:var(--card); border:1px solid var(--line); border-radius:20px; padding:36px 34px; }
  .brand { font-weight:700; color:var(--accent); letter-spacing:.3px; }
  h1 { font-size:26px; margin:8px 0 4px; }
  p { color:var(--muted); margin:0 0 24px; }
  a.btn { display:block; text-decoration:none; color:var(--ink); border:1px solid var(--line); border-radius:12px; padding:16px 18px; margin-bottom:12px; font-weight:600; }
  a.btn span { display:block; font-weight:400; font-size:13px; color:var(--muted); margin-top:2px; }
  footer { margin-top:14px; font-size:12px; color:var(--muted); }
</style>
</head>
<body>
  <div class="card">
    <div class="brand">RiskWise</div>
    <h1>Legal &amp; Policies</h1>
    <p>Educational options-risk review — not financial advice.</p>
    <a class="btn" href="privacy.html">Privacy Policy<span>How RiskWise handles your data</span></a>
    <a class="btn" href="terms.html">Terms &amp; Disclaimer<span>Educational use, market-data limits, AI limitations</span></a>
    <footer>© 2026 RiskWise. Beta.</footer>
  </div>
</body>
</html>
